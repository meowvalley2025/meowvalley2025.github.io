  const SignatureModal = ({ onSave, onClose }) => {
    const canvasRef = useRef(null);
    let drawing = false;

    useEffect(() => {
      const canvas = canvasRef.current;
      const ctx = canvas.getContext('2d');
      const ratio = window.devicePixelRatio || 1;
      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = canvas.offsetHeight * ratio;
      ctx.scale(ratio, ratio);
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#4a3f36';

      const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      };
      const start = (e) => { drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); };
      const move = (e) => { if(!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); };
      const stop = () => { drawing = false; };

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', move);
      window.addEventListener('mouseup', stop);
      canvas.addEventListener('touchstart', start, {passive:false});
      canvas.addEventListener('touchmove', move, {passive:false});
      canvas.addEventListener('touchend', stop);
      return () => window.removeEventListener('mouseup', stop);
    }, []);

    return (
      <div className="fixed inset-0 bg-ink/90 z-[120] flex flex-col items-center justify-center p-4 backdrop-blur-md">

            }}>重簽</button>
            <button className="py-4 bg-milk-deep text-white rounded-2xl font-bold" onClick={() => onSave(canvasRef.current.toDataURL())}>完成簽名</button>
          </div>
        </div>
      </div>
    );
  };

              <input type="text" name="prefHospital" placeholder="若未填寫，則依店家特約醫院" className="w-full bg-white/60 border border-milk-soft rounded-xl p-3 text-sm outline-none focus:border-milk-deep transition-all" onChange={handleChange} />
            </div>
            
            <div className="bg-orange-50/60 border border-orange-100/80 rounded-[24px] p-5 flex gap-4 items-start shadow-sm relative overflow-hidden group">
              {/* 背景微裝飾 */}
              <div className="absolute -right-2 -bottom-2 opacity-5 group-hover:scale-110 transition-transform"><i data-lucide="hospital" className="w-16 h-16 text-orange-900"></i></div>

                <p className="text-[10px] font-black text-orange-800 uppercase tracking-widest mb-1.5 flex items-center gap-2">
                  <span className="w-1 h-3 bg-orange-400 rounded-full"></span> 乙方特約醫院
                </p>
                <p className="font-bold text-sm text-orange-900 mb-0.5">新生動物醫院 (04-25257658)</p>
                <p className="text-[11px] text-orange-800/60 leading-tight">台中市豐原區新生北路59號</p>
              </div>
            </div>
          </div>
        </div>
        <div className="bg-orange-50/40 border border-orange-100 rounded-[24px] p-5 mb-5">
          <div className="space-y-3">
            <label className="flex items-center gap-3 p-2 cursor-pointer"><input type="checkbox" name="agreeTerms" checked={formData.agreeTerms} onChange={handleChange} className="w-5 h-5 accent-milk-deep" /><span className="text-sm">同意 <button onClick={() => setActiveModal('terms')} className="text-milk-deep underline font-bold">服務契約</button></span></label>
            <label className="flex items-center gap-3 p-2 cursor-pointer"><input type="checkbox" name="agreeHighRisk" checked={formData.agreeHighRisk} onChange={handleChange} className="w-5 h-5 accent-red-500" /><span className="text-sm">同意 <button onClick={() => setActiveModal('highrisk')} className="text-red-500 underline font-bold">高風險聲明</button></span></label>
          </div>
        </div>

        <div className="px-2 mb-8">
          <p className="text-[10px] font-bold text-sub mb-2 uppercase tracking-widest text-center">甲方 (飼主) 數位簽署</p>
          <div className="sig-preview-area bg-white/80 border-2 border-dashed border-milk rounded-3xl h-32 flex items-center justify-center overflow-hidden" onClick={() => setShowSig(true)}>
            {sigImage ? <img src={sigImage} className="max-h-full" /> : <p className="text-[10px] text-sub">點擊簽名</p>}
          </div>
        </div>

        <div className="grid grid-cols-2 gap-4 px-2">
          <button className="py-4 bg-white/50 text-sub rounded-2xl font-bold shadow-sm" onClick={onBack}>返回</button>
          <button className={`py-4 rounded-2xl font-bold shadow-lg ${(!formData.agreeTerms || !formData.agreeHighRisk || !sigImage) ? 'bg-gray-300 text-white' : 'bg-milk-deep text-white'}`} onClick={handleFinalSubmit}>確認送出</button>
        </div>

        {activeModal === 'highrisk' && (
          <TermsModal title="高風險寵物美容聲明" onClose={() => setActiveModal(null)}>

  // --- 主程式：控制中心 ---
  function App() {
    const getHash = () => window.location.hash.replace('#', '') || 'home';
    const [view, setView] = useState(getHash());

    useEffect(() => {
      const handlePopState = () => setView(getHash());
      window.addEventListener('hashchange', handlePopState);
      lucide.createIcons();
      return () => window.removeEventListener('hashchange', handlePopState);
    }, [view]);

    const navigateTo = (v) => { window.location.hash = v; };

    return (
      <div className="min-h-screen">
        <nav>
          <div className="nav-inner">
            <div className="brand" onClick={() => navigateTo('home')}>
              <img src="logo.png" alt="Logo" />
              <span className="font-black text-ink tracking-tighter">喵之谷</span>
            </div>
            <button className="home-btn" onClick={() => navigateTo('home')}>HOME</button>
          </div>
        </nav>
        <main className="wrap">
          {view === 'home' && <HomeView onNavigate={navigateTo} />}
          {view === 'grooming' && <ContractForm title="純貓美容契約" type="grooming" onBack={() => navigateTo('home')} />}
          {view === 'boarding' && <ContractForm title="純貓住宿契約" type="boarding" onBack={() => navigateTo('home')} />}
        </main>
      </div>
    );
  }

  // 渲染到網頁
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
