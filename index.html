const compressImage = async (file, maxWidth = 1024, quality = 0.8) => {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        if (width > maxWidth) {
          height = (height * maxWidth) / width;
          width = maxWidth;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        canvas.toBlob(
          (blob) => {
            resolve(new File([blob], file.name, { type: 'image/jpeg' }));
          },
          'image/jpeg',
          quality
        );
      };
    };
  });
};

const uploadToStorage = async (file, folder = 'uploads') => {
  try {
    const fileName = `${Date.now()}_${file.name}`;
    const { data, error } = await supabase.storage
      .from('meowvalley-uploads')
      .upload(`${folder}/${fileName}`, file);

    if (error) throw error;

    const { data: { publicUrl } } = supabase.storage
      .from('meowvalley-uploads')
      .getPublicUrl(`${folder}/${fileName}`);

    return publicUrl;
  } catch (error) {
    console.error('上傳失敗:', error);
    throw error;
  }

const SignatureModal = ({ onSave, onClose }) => {
  const canvasRef = useRef(null);
  const drawingRef = useRef(false);
  const hasDrawnRef = useRef(false);

  useEffect(() => {
    const originalOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';

    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');

    const resizeCanvas = () => {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;

      canvas.width = rect.width * ratio;
      canvas.height = rect.height * ratio;

      // ✅ 這行最重要：每次 resize 必須 reset
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(ratio, ratio);

      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#4a3f36';
    };

    // ✅ 等渲染完成再 resize
    requestAnimationFrame(resizeCanvas);
    window.addEventListener('resize', resizeCanvas);

    const getPos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    };

    const start = (e) => {
      drawingRef.current = true;
      const p = getPos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    };

    const move = (e) => {
      if (!drawingRef.current) return;
      const p = getPos(e);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      hasDrawnRef.current = true;
      e.preventDefault();
    };

    const stop = () => {
      drawingRef.current = false;
    };

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', stop);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', stop);

    return () => {
      document.body.style.overflow = originalOverflow;
      window.removeEventListener('resize', resizeCanvas);
      window.removeEventListener('mouseup', stop);
      canvas.removeEventListener('mousedown', start);
      canvas.removeEventListener('mousemove', move);
      canvas.removeEventListener('touchstart', start);
      canvas.removeEventListener('touchmove', move);
      canvas.removeEventListener('touchend', stop);
    };
  }, []);

  return (
    <div className="fixed inset-0 z-[120] bg-[#f6efe7] flex flex-col">
      <div className="bg-milk-deep text-white px-5 py-4 flex justify-between items-center shadow-md">
        <div className="font-black text-sm tracking-widest">請簽名</div>
        <button onClick={onClose} className="p-2 rounded-full bg-white/20">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div className="flex-1 bg-[#fcfaf8] relative touch-none">
        <canvas ref={canvasRef} className="w-full h-full block"></canvas>
      </div>

      <div className="p-4 bg-white border-t flex gap-3">
        <button
          onClick={() => {
            const ctx = canvasRef.current.getContext('2d');
            ctx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);
            hasDrawnRef.current = false;
          }}
          className="flex-1 py-3 bg-gray-100 rounded-xl font-bold text-sub"
        >
          重寫
        </button>
        <button
          onClick={() => {
            if (!hasDrawnRef.current) {

            }

    </div>
  );
};

const handleSearchHistory = async () => {
  if (!formData.phone || formData.phone.length < 9) {
    alert("⚠️ 請先輸入完整的聯絡電話");
    return;
  }

  setIsSearching(true);
  try {
    // 呼叫 Supabase RPC 函數 (需在後端建立對應函數)
    const { data, error } = await supabase.rpc('search_guest_history', { 
      phone_input: formData.phone 
    });

    if (error) throw error;

    if (!data || data.length === 0) {
      alert("🔍 查無此電話的過往紀錄");
      return;
    }

    // 整理資料：將資料庫欄位與 JSON 內容合併
    const allRecords = data.map(r => {
      const dbType = r.service_type || '';
      const innerData = r.raw_data.raw_data || r.raw_data || {};
      const jsonType = innerData.service_type || r.raw_data.service_type || '';
      
      // 判斷是否為住宿紀錄
      const isBoardingRecord = 
        dbType === 'boarding' || dbType === 'daycare' || 
        jsonType.includes('住宿') || jsonType.includes('安親');

      return {
        ...innerData, 
        id: r.id,
        created_at: r.created_at,
        source: isBoardingRecord ? 'boarding' : 'grooming'
      };
    });

    // 核心邏輯：先以「名字」分組，每隻寵物底下保留「最新美容」與「最新住宿」
    const petsGroup = {};

    // 依照時間排序 (最新的在前)
    allRecords.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

    allRecords.forEach(r => {
      const petName = r.pet_name?.trim();
      if (!petName) return;

      // 初始化該寵物的欄位
      if (!petsGroup[petName]) {
        petsGroup[petName] = { 
          name: petName, 
          grooming: null, 
          boarding: null,
          lastSeen: r.created_at 
        };
      }

      // 如果該類型還沒有存入紀錄，就存入 (因為已經按時間排序，所以第一個遇到的一定是最新的)
      if (r.source === 'grooming' && !petsGroup[petName].grooming) {
        petsGroup[petName].grooming = r;
      } else if (r.source === 'boarding' && !petsGroup[petName].boarding) {
        petsGroup[petName].boarding = r;
      }
    });

    // 轉為陣列並排序 (最近有來的寵物排上面)
    const sortedPets = Object.values(petsGroup).sort((a, b) => new Date(b.lastSeen) - new Date(a.lastSeen));

    setHistoryRecords(sortedPets);
    setShowHistoryModal(true);

  } catch (err) {
    console.error("搜尋舊客失敗:", err);
    alert("搜尋失敗，請檢查網路或確認後端設定。");
  } finally {
    setIsSearching(false);
  }
};

      window.addEventListener('hashchange', handlePopState);

      return () => window.removeEventListener('hashchange', handlePopState);

    return (

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js?v=2').then(function (reg) {

      if (reg.waiting) {
        reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      }

      reg.addEventListener('updatefound', function () {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', function () {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            newWorker.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      });
    });

    navigator.serviceWorker.addEventListener('controllerchange', function () {
      window.location.reload();
    });
  });
}
