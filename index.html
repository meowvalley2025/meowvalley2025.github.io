const compressImage = async (file, maxWidth = 1024, quality = 0.8) => {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        // 計算縮放比例
        if (width > maxWidth) {
          height = (height * maxWidth) / width;
          width = maxWidth;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        
        // 設定白色背景（避免 PNG 轉 JPEG 時變透明）
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, width, height);
        
        // 繪製圖片
        ctx.drawImage(img, 0, 0, width, height);

        canvas.toBlob(
          (blob) => {
            resolve(new File([blob], file.name, { type: 'image/jpeg' }));
          },
          'image/jpeg',
          quality
        );
      };
    };
  });
};

const uploadToStorage = async (file, folder = 'uploads') => {
  try {
    if (!file) return null;

    const mime = file.type || 'image/jpeg';
    let ext = 'jpg';
    if (mime.includes('png')) ext = 'png';
    if (mime.includes('webp')) ext = 'webp';

    const fileName = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const filePath = `${folder}/${fileName}`;

    const { error: uploadError } = await sbClient.storage
      .from('meowvalley-uploads')
      .upload(filePath, file, {
        cacheControl: '3600',
        upsert: false,
        contentType: mime
      });

    if (uploadError) throw uploadError;

    const { data: { publicUrl } } = sbClient.storage
      .from('meowvalley-uploads')
      .getPublicUrl(filePath);

    return publicUrl;
  } catch (error) {
    console.error('上傳失敗:', error);
    throw error;
  }
};

const escHtml = (v = '') =>
  String(v)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');

const formatDateTime = (iso) => {
  try {
    return new Date(iso).toLocaleString('zh-TW', { hour12: false });
  } catch {
    return String(iso || '');
  }
};

const valueToText = (val) => {
  if (val === null || val === undefined) return '';
  if (typeof val === 'boolean') return val ? '是' : '否';
  if (Array.isArray(val)) return val.join('、');
  if (typeof val === 'object') return JSON.stringify(val);
  return String(val);
};

const flattenObjectRows = (obj, parentKey = '') => {
  const rows = [];
  if (!obj || typeof obj !== 'object') return rows;

  Object.keys(obj).forEach((key) => {
    const fullKey = parentKey ? `${parentKey}.${key}` : key;
    const value = obj[key];

    if (value && typeof value === 'object' && !Array.isArray(value)) {
      rows.push(...flattenObjectRows(value, fullKey));
    } else {
      rows.push({ key: fullKey, value: valueToText(value) });
    }
  });

  return rows;
};
const joinFilled = (...vals) => {
  const list = vals
    .map(v => {
      if (Array.isArray(v)) return v.join('、');
      return (v === null || v === undefined) ? '' : String(v).trim();
    })
    .filter(Boolean);
  return list.length ? list.join('｜') : '—';
};

    console.warn('customerEmail 格式無效，改為只寄店家：', customerRaw);
  }
  if (storeRaw && !store) {
    console.warn('storeEmail 格式無效：', storeRaw);
  }

  if (!customer && !store) {
    return [{ target: '', bcc: '', data: null, error: new Error('無有效收件者') }];
  }

  const body = {
    to: [customer || store],
    html,
    serviceType,
    petNames
  };

  // 可手動覆蓋主旨
  if ((subjectBase || '').trim()) {
    body.subject = subjectBase.trim();
  }

  // 客人有效 + 店家有效 + 兩者不同 => 店家放 BCC
  if (customer && store && customer !== store) {
    body.bcc = [store];
  }

  const { data, error } = await sbClient.functions.invoke('resend-email', { body });

  return [{
    target: body.to[0],
    bcc: (body.bcc && body.bcc[0]) ? body.bcc[0] : '',
    data,
    error
  }];
};

const SignatureModal = ({ onSave, onClose }) => {
  const canvasRef = useRef(null);
  const drawingRef = useRef(false);
  const hasDrawnRef = useRef(false);

  useEffect(() => {
    const originalOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';

    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');

    const resizeCanvas = () => {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;

      canvas.width = rect.width * ratio;
      canvas.height = rect.height * ratio;

      // ✅ 這行最重要：每次 resize 必須 reset
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(ratio, ratio);

      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#4a3f36';
    };

    // ✅ 等渲染完成再 resize
    requestAnimationFrame(resizeCanvas);
    window.addEventListener('resize', resizeCanvas);

    const getPos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    };

    const start = (e) => {
      drawingRef.current = true;
      const p = getPos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    };

    const move = (e) => {
      if (!drawingRef.current) return;
      const p = getPos(e);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      hasDrawnRef.current = true;
      e.preventDefault();
    };

    const stop = () => {
      drawingRef.current = false;
    };

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', stop);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', stop);

    return () => {
      document.body.style.overflow = originalOverflow;
      window.removeEventListener('resize', resizeCanvas);
      window.removeEventListener('mouseup', stop);
      canvas.removeEventListener('mousedown', start);
      canvas.removeEventListener('mousemove', move);
      canvas.removeEventListener('touchstart', start);
      canvas.removeEventListener('touchmove', move);
      canvas.removeEventListener('touchend', stop);
    };
  }, []);

  return (
    <div className="fixed inset-0 z-[120] bg-[#f6efe7] flex flex-col">
      <div className="bg-milk-deep text-white px-5 py-4 flex justify-between items-center shadow-md">
        <div className="font-black text-sm tracking-widest">請簽名</div>
        <button onClick={onClose} className="p-2 rounded-full bg-white/20">
          <i data-lucide="x"></i>
        </button>
      </div>

      {/* ✅ 畫布區增加底部空間，避免被按鈕遮住 */}
      <div className="flex-1 bg-[#fcfaf8] relative touch-none" style={{ paddingBottom: '88px' }}>
        <canvas ref={canvasRef} className="w-full h-full block"></canvas>
      </div>

      {/* ✅ 底部按鈕固定在畫面最下方 */}
      <div className="fixed bottom-0 left-0 right-0 p-4 bg-white border-t flex gap-3">
        <button
          onClick={() => {
            const ctx = canvasRef.current.getContext('2d');
            ctx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);
            hasDrawnRef.current = false;
          }}
          className="flex-1 py-3 bg-gray-100 rounded-xl font-bold text-sub"
        >
          重寫
        </button>
        <button
          onClick={() => {
            if (!hasDrawnRef.current) {
              alert('請先簽名');
              return;
            }
            onSave(canvasRef.current.toDataURL());
          }}
          className="flex-[2] py-3 bg-milk-deep text-white rounded-xl font-bold shadow-lg"
        >

        </button>
      </div>
    </div>
  );
};

const handleSearchHistory = async () => {
  if (!formData.phone || formData.phone.length < 9) {
    alert("⚠️ 請先輸入完整的聯絡電話");
    return;
  }

  setIsSearching(true);
  try {
    // 呼叫 Supabase RPC 函數 (需在後端建立對應函數)
    const { data, error } = await sbClient.rpc('search_guest_history', { 
      phone_input: formData.phone 
    });

    if (error) throw error;

    if (!data || data.length === 0) {
      alert("🔍 查無此電話的過往紀錄");
      return;
    }

    // 整理資料：將資料庫欄位與 JSON 內容合併
    const allRecords = data.map(r => {
      const dbType = r.service_type || '';
      const innerData = r.raw_data.raw_data || r.raw_data || {};
      const jsonType = innerData.service_type || r.raw_data.service_type || '';
      
      // 判斷是否為住宿紀錄
      const isBoardingRecord = 
        dbType === 'boarding' || dbType === 'daycare' || 
        jsonType.includes('住宿') || jsonType.includes('安親');

      return {
        ...innerData, 
        id: r.id,
        created_at: r.created_at,
        source: isBoardingRecord ? 'boarding' : 'grooming'
      };
    });

    // 核心邏輯：先以「名字」分組，每隻寵物底下保留「最新美容」與「最新住宿」
    const petsGroup = {};

    // 依照時間排序 (最新的在前)
    allRecords.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

    allRecords.forEach(r => {
      const petName = r.pet_name?.trim();
      if (!petName) return;

      // 初始化該寵物的欄位
      if (!petsGroup[petName]) {
        petsGroup[petName] = { 
          name: petName, 
          grooming: null, 
          boarding: null,
          lastSeen: r.created_at 
        };
      }

      // 如果該類型還沒有存入紀錄，就存入 (因為已經按時間排序，所以第一個遇到的一定是最新的)
      if (r.source === 'grooming' && !petsGroup[petName].grooming) {
        petsGroup[petName].grooming = r;
      } else if (r.source === 'boarding' && !petsGroup[petName].boarding) {
        petsGroup[petName].boarding = r;
      }
    });

    // 轉為陣列並排序 (最近有來的寵物排上面)
    const sortedPets = Object.values(petsGroup).sort((a, b) => new Date(b.lastSeen) - new Date(a.lastSeen));

    setHistoryRecords(sortedPets);
    setShowHistoryModal(true);

  } catch (err) {
    console.error("搜尋舊客失敗:", err);
    alert("搜尋失敗，請檢查網路或確認後端設定。");
  } finally {
    setIsSearching(false);
  }
};

      const idx = seg.indexOf(':');
      if (idx === -1) return;
      const k = seg.slice(0, idx).trim();
      const v = seg.slice(idx + 1).trim();
      if (k) obj[k] = v;
    });
    return obj;

const customerEmail = isValidEmail(sourceData.contact || '')

function App() {
const getHash = () => window.location.hash.replace('#', '') || 'home';
const [view, setView] = useState(getHash());

// ✅ 首頁大 Logo 雙擊判斷（手機/桌機都可用）
const lastHeroLogoTapRef = useRef(0);

useEffect(() => {
  const handlePopState = () => setView(getHash());
  window.addEventListener('hashchange', handlePopState);
  return () => window.removeEventListener('hashchange', handlePopState);
}, []);

useEffect(() => {
  lucide.createIcons();
}, [view]);

const navigateTo = (v) => { window.location.hash = v; };

// ✅ 跳轉 admin（PWA/手機可用）
const goAdminPage = () => {
  // PWA/手機端較穩定：用完整 URL 跳轉
  const target = new URL('/admin.html', window.location.origin).toString();
  window.location.href = target;
};

// ✅ 首頁大 Logo：320ms 內連點兩下就進 admin
const handleHeroLogoTap = (e) => {
  if (e) e.preventDefault();

  const now = Date.now();
  const gap = now - lastHeroLogoTapRef.current;

  if (gap > 0 && gap < 320) {
    lastHeroLogoTapRef.current = 0;
    goAdminPage();
    return;
  }

  lastHeroLogoTapRef.current = now;
};

    return (
      <div className="min-h-screen">
        <nav>
          <div className="nav-inner">
            <div className="brand" onClick={() => navigateTo('home')}>
              <img src="logo.png" alt="Logo" />
              <span className="font-black text-ink tracking-tighter">喵之谷</span>
            </div>
            <button className="home-btn" onClick={() => navigateTo('home')}>HOME</button>
          </div>
        </nav>
<main className="wrap">
{view === 'home' && <HomeView onNavigate={navigateTo} onHeroLogoTap={handleHeroLogoTap} />}
{view === 'grooming' && (
  <ContractForm
    title="美容契約"
    type="grooming"
    onBack={() => navigateTo('home')}
    onSuccess={() => navigateTo('view-success')}
  />
)}
{view === 'boarding' && (
  <ContractForm
    title="住宿契約"
    type="boarding"
    onBack={() => navigateTo('home')}
    onSuccess={() => navigateTo('view-success')}
  />
)}
{view === 'mainecoon' && (
  <MaineCoonForm
    onBack={() => navigateTo('home')}
    onSuccess={() => navigateTo('view-success')}
  />
)}
  {view === 'view-success' && <SuccessView onNavigate={navigateTo} />}
</main>
      </div>
    );
  }

  // 渲染到網頁
  const rootEl = document.getElementById('root');
  if (!rootEl) {
    console.error('找不到 #root');
  } else {
    const root = ReactDOM.createRoot(rootEl);
    root.render(<App />);
  }
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async function () {
    try {
      const reg = await navigator.serviceWorker.register('/sw.js?v=16');

      if (reg.waiting) {
        reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      }

      reg.addEventListener('updatefound', function () {
        const newWorker = reg.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', function () {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            newWorker.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      });

      navigator.serviceWorker.addEventListener('controllerchange', function () {
        window.location.reload();
      });
    } catch (e) {
      console.error('SW 註冊/更新失敗：', e);
    }
  });
}
