<style>
  @font-face {
    font-family: "JasonHandwriting";
    src: url("JasonHandwriting1.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root{
    --bg:#f7f3ef;
    --bg2:#efe7df;
    --deep:#b78963;
    --soft:#ead6c3;
    --ink:#2f2a26;
    --sub:#7d746b;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    /* 後台可讀性優先：不用手寫字體 */
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 10% 10%, rgba(183,137,99,.10) 0%, transparent 35%),
      radial-gradient(circle at 90% 90%, rgba(183,137,99,.08) 0%, transparent 38%),
      linear-gradient(180deg, #fbf8f5 0%, var(--bg) 56%, var(--bg2) 100%);
    -webkit-font-smoothing: antialiased;
  }

  .glass{
    background:rgba(255,255,255,.78);
    border:1px solid rgba(233,220,206,.9);
    backdrop-filter: blur(8px);
    border-radius:20px;
    box-shadow:0 10px 25px rgba(73,58,47,.08);
  }

  .cute-card{
    background:#fff;
    border:1px solid #ecdccc;
    border-radius:16px;
    box-shadow:0 4px 12px rgba(73,58,47,.06);
    transition:.18s ease;
  }

  .cute-card:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 18px rgba(73,58,47,.10);
  }

  .tab-btn{
    border:1px solid #e8d8c8;
    border-radius:12px;
    font-weight:800;
    font-size:13px;
    padding:10px 12px;
    color:var(--sub);
    background:white;
  }

  .tab-btn.active{
    background:var(--deep);
    border-color:var(--deep);
    color:white;
    box-shadow:0 6px 12px rgba(183,137,99,.22);
  }

  .pill{
    font-size:11px;
    font-weight:800;
    border-radius:999px;
    padding:4px 10px;
    white-space:nowrap;
  }

  .pill-groom{ background:#e8f1ff; color:#3f69a8; }
  .pill-board{ background:#fff1e7; color:#9a5d2f; }
  .pill-home { background:#eef9ef; color:#3e7d49; }
  .pill-maine{ background:#f2ebff; color:#6a4ea0; }

  .badge-admin{
    background:#ecf7ed; color:#3e7d49; border:1px solid #cfe8d2;
  }

  .badge-staff{
    background:#fff2e7; color:#9a5d2f; border:1px solid #f2d6bf;
  }

  .input{
    width:100%;
    border:1px solid #e7ddd4;
    border-radius:12px;
    background:#fff;
    padding:11px 12px;
    outline:none;
    font-size:14px;
    color:var(--ink);
  }

  .input:focus{
    border-color:var(--deep);
    box-shadow:0 0 0 3px rgba(183,137,99,.14);
  }

  .stat-card{
    background:linear-gradient(180deg, #ffffff 0%, #fdf9f6 100%);
    border:1px solid #ead8c8;
    border-radius:16px;
    padding:12px;
    text-align:center;
  }

  .stat-label{
    font-size:12px;
    color:#8a7f74;
    font-weight:700;
    margin-bottom:4px;
  }

  .stat-value{
    font-size:28px;
    line-height:1;
    font-weight:900;
    color:#3f372f;
  }

  .record-card{
    width:100%;
    text-align:left;
    border:1px solid #e9d8c7;
    border-radius:16px;
    background:#fff;
    padding:14px;
    box-shadow:0 3px 10px rgba(73,58,47,.06);
  }

  .record-id{
    font-size:11px;
    color:#9f958a;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  }
.mv-record{
  width:100%;
  text-align:left;
  border:1px solid #eadccd;
  border-radius:20px;
  background:#fffdfb;
  padding:14px 14px 12px 14px;
  box-shadow:0 4px 12px rgba(73,58,47,.06);
  transition:.18s ease;
  position:relative;
  overflow:hidden;
}
.mv-record:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 20px rgba(73,58,47,.10);
  border-color:#dcc3ad;
}
.mv-record::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
  border-radius:4px;
  background:#d8cabd;
}
.mv-record-grooming::before{ background:#7ea3d9; }
.mv-record-boarding::before{ background:#b78963; }
.mv-record-homecare::before{ background:#6ea97a; }
.mv-record-maine::before{ background:#9a82c8; }

.mv-record-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}
.mv-record-meta{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:4px;
}
.mv-subtag{
  font-size:10px;
  font-weight:900;
  color:#8a7f74;
  border:1px solid #eadfD4;
  border-radius:999px;
  padding:2px 8px;
  background:#fff;
}
.mv-record-name{
  font-size:24px;
  line-height:1.15;
  font-weight:900;
  color:#3f352d;
}
.mv-record-sub{
  font-size:12px;
  color:#8a7f74;
  font-weight:700;
}
.mv-record-time{
  font-size:12px;
  color:#7f7367;
  font-weight:900;
  white-space:nowrap;
}
.mv-record-line{
  border-top:1px dashed #ebdfd3;
  margin:10px 0 8px;
}
.mv-record-foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.mv-record-ownerphone{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  flex-wrap:wrap;
}
.mv-record-owner{
  font-size:13px;
  color:#8a7f74;
  font-weight:800;
}
.mv-record-phone{
  font-size:13px;
  color:#6f6459;
  font-weight:900;
}
@media (max-width: 640px){
  .mv-record-name{
    font-size:20px;
  }
}
/* ===== Detail Modal (宿洗層級感，喵之谷奶茶色) ===== */
.mv-dm-panel{
  width:100%;
  max-width:980px;
  max-height:92vh;
  overflow-y:auto;
  background:#f8f3ee;
  border:1px solid #e9ddcf;
  border-radius:20px;
  box-shadow:0 20px 45px rgba(48,36,28,.22);
}
.mv-dm-head{
  position:sticky;
  top:0;
  z-index:2;
  background:rgba(255,253,250,.96);
  backdrop-filter: blur(8px);
  border-bottom:1px solid #eadfD2;
  padding:12px 14px;
  border-top-left-radius:20px;
  border-top-right-radius:20px;
}
.mv-dm-title{
  font-size:16px;
  line-height:1.2;
  font-weight:900;
  color:#3f352d;
}
.mv-dm-sub{
  margin-top:6px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.mv-dm-subchip{
  font-size:11px;
  font-weight:800;
  color:#7f7367;
  border:1px solid #e7d9cb;
  border-radius:999px;
  padding:3px 10px;
  background:#fff;
}
.mv-dm-body{
  padding:10px;
}
@media (min-width: 768px){
  .mv-dm-title{ font-size:24px; }
  .mv-dm-body{ padding:16px; }
  .mv-dm-head{ padding:16px 18px; }
}
.mv-dm-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}
@media(min-width:900px){
  .mv-dm-grid{
    grid-template-columns:1fr 1fr;
  }
}
.mv-dm-section{
  background:#fffdfb;
  border:1px solid #e8dccc;
  border-radius:18px;
  padding:14px;
  box-shadow:0 4px 10px rgba(73,58,47,.05);
}
.mv-dm-section-title{
  font-size:15px;
  font-weight:900;
  color:#473c33;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:6px;
}
.mv-dm-list{
  display:grid;
  gap:0;
  border-top:1px solid #f0e6dc;
}

.mv-dm-row{
  background:transparent;
  padding:10px 2px;
  border-bottom:1px dashed #ebdfd3;
}

.mv-dm-label{
  font-size:11px;
  color:#9a8f83;
  font-weight:800;
  margin-bottom:3px;
  letter-spacing:.02em;
}

.mv-dm-value{
  font-size:15px;
  color:#3c332c;
  font-weight:900;
  word-break:break-word;
  line-height:1.45;
}

/* 附件（簽名/連結）維持卡片感，避免全部扁掉 */
.mv-dm-attach{
  border:1px solid #efe4d8;
  border-radius:12px;
  background:#fff;
  padding:8px 10px;
}
.mv-dm-sign{
  width:100%;
  height:128px;
  object-fit:contain;
  border:1px solid #eadfD2;
  border-radius:12px;
  background:#faf7f3;
}
.mv-dm-actions{
  display:flex;
  align-items:center;
  gap:8px;
}
.mv-dm-close{
  padding:8px 12px;
  border-radius:12px;
  border:1px solid #e5d8ca;
  background:#fff;
  font-size:12px;
  font-weight:900;
}
.mv-dm-del{
  padding:8px 12px;
  border-radius:12px;
  border:1px solid #ffd6d6;
  background:#fff1f1;
  color:#d85050;
  font-size:12px;
  font-weight:900;
}
/* ===== Top right actions ===== */
.mv-top-link{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:14px;
  font-weight:900;
  color:#7b6f63;
  background:transparent;
  border:none;
  padding:4px 2px;
  cursor:pointer;
}
.mv-top-link:hover{
  color:#5f5449;
}
.mv-top-sep{
  width:1px;
  height:16px;
  background:#d8cdc1;
  margin:0 6px;
}

/* ===== Password Modal ===== */
.mv-pwd-mask{
  position:fixed;
  inset:0;
  z-index:130;
  background:rgba(0,0,0,.42);
  backdrop-filter: blur(2px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
}
.mv-pwd-panel{
  width:100%;
  max-width:420px;
  border-radius:24px;
  border:1px solid #ddd2c6;
  background:#f5f1ec;
  box-shadow:0 24px 40px rgba(48,36,28,.28);
  padding:14px;
}
.mv-pwd-title{
  font-size:46px;
  line-height:1;
  text-align:center;
  font-weight:900;
  color:#7a6251;
  margin:6px 0 10px;
}
@media (max-width:640px){
  .mv-pwd-title{ font-size:26px; }
}
.mv-pwd-close{
  border:none;
  background:transparent;
  color:#9f8f82;
  cursor:pointer;
  padding:4px;
}
.mv-pwd-role-wrap{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  padding:4px;
  border-radius:13px;
  border:1px solid #d6ccbf;
  background:#dfdad3;
  margin-bottom:14px;
}
.mv-pwd-role{
  border:1px solid transparent;
  border-radius:10px;
  font-size:22px;
  font-weight:900;
  color:#8d7b6e;
  padding:8px 0;
  background:transparent;
}
@media (max-width:640px){
  .mv-pwd-role{ font-size:24px; }
}
.mv-pwd-role.active{
  background:#f7f4ef;
  border-color:#d5c8bb;
  color:#6d5646;
}
.mv-pwd-role.disabled{
  opacity:.65;
  cursor:not-allowed;
}
.mv-pwd-input{
  width:100%;
  border:1px solid #dbd0c4;
  border-radius:13px;
  background:#ece8e3;
  color:#7a6a5f;
  font-weight:800;
  font-size:26px;
  padding:10px 12px;
  outline:none;
}
@media (max-width:640px){
  .mv-pwd-input{ font-size:17px; }
}
.mv-pwd-input::placeholder{
  color:#b7aca3;
}
.mv-pwd-input:focus{
  border-color:#b78963;
  background:#f7f4ef;
  box-shadow:0 0 0 3px rgba(183,137,99,.12);
}
.mv-pwd-line{
  border-top:1px solid #dfd5ca;
  margin:8px 0 12px;
}
.mv-pwd-submit{
  width:100%;
  border:none;
  border-radius:12px;
  background:#6a5d4f;
  color:#fff;
  font-size:30px;
  font-weight:900;
  padding:10px 0;
  cursor:pointer;
}
.mv-pwd-submit:disabled{
  opacity:.7;
  cursor:not-allowed;
}
@media (max-width:640px){
  .mv-pwd-submit{ font-size:18px; }
}
.mv-pwd-err{
  font-size:13px;
  color:#c75252;
  font-weight:900;
  margin-top:4px;
}
.mv-pwd-ok{
  font-size:13px;
  color:#3f8a58;
  font-weight:900;
  margin-top:4px;
}
</style>

      try {

const serviceTypeLabel = (s) => {

};

const formatTWDateTime = (v) => {

  }).format(d).replace(",", "");

const isDisplayable = (v) => {

};
    function LoginView({ onLoggedIn }) {
      const [modeEmail, setModeEmail] = useState("");
      const [password, setPassword] = useState("");
      const [loading, setLoading] = useState(false);
      const [err, setErr] = useState("");

      const handleLogin = async (e) => {
        e.preventDefault();
        setErr("");
        if (!modeEmail) return setErr("請先選擇登入身分");
        setLoading(true);

        const { error } = await supabase.auth.signInWithPassword({
          email: modeEmail,
          password
        });

        setLoading(false);
        if (error) {
          setErr("登入失敗：帳號或密碼錯誤");
          return;
        }
        onLoggedIn();
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-5">

              <div className="space-y-3">

                >
                  <div className="w-10 h-10 rounded-xl bg-mv-deep text-white flex items-center justify-center">
                    <Icon name="shield-check" size={18}/>
                  </div>
                  <div className="text-left">
                    <div className="font-black text-mv-ink">管理員登入</div>
                  </div>
                </button>

                <button
                  onClick={() => setModeEmail(STAFF_EMAIL)}
                  className="w-full bg-white border border-mv-soft rounded-2xl py-4 px-4 flex items-center gap-3 hover:border-mv-deep"
                >
                  <div className="w-10 h-10 rounded-xl bg-[#8f7a67] text-white flex items-center justify-center">
                    <Icon name="user" size={18}/>
                  </div>
                  <div className="text-left">
                    <div className="font-black text-mv-ink">員工登入</div>
                  </div>
                </button>
              </div>
            ) : (
              <form onSubmit={handleLogin} className="space-y-4">
                <div className={"inline-flex px-4 py-1 rounded-full text-xs font-black " + (modeEmail === ADMIN_EMAIL ? "badge-admin" : "badge-staff")}>

                <input

                />

                <button
                  className="w-full py-3 rounded-xl bg-mv-deep text-white font-black disabled:opacity-50"
                  disabled={loading}
                >
                  {loading ? "登入中..." : "確認登入"}
                </button>

                <button
                  type="button"
                  className="text-xs text-mv-sub hover:text-mv-ink"
                  onClick={() => { setModeEmail(""); setPassword(""); setErr(""); }}

                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

function DetailModal({ row, canDelete, onDelete, onClose }) {
  if (!row) return null;
  const raw = row.raw || {};

  const isEmpty = (v) => {
    if (v === null || v === undefined) return true;
    if (typeof v === "string" && v.trim() === "") return true;
    if (Array.isArray(v) && v.length === 0) return true;
    return false;
  };

  const pick = (...vals) => {
    for (const v of vals) {
      if (!isEmpty(v)) return v;
    }
    return "";
  };

        return allRows.filter(r => {
          const byTab = tab === "all" ? true : r.type === tab;
          const txt = `${r.owner_name} ${r.phone} ${r.pet_name} ${r.id} ${r.subtype} ${r.title}`.toLowerCase();
          const bySearch = txt.includes(q.toLowerCase());
          return byTab && bySearch;
        });
      }, [allRows, tab, q]);

      const handleDelete = async (row) => {
        if (!isAdmin) return;
        if (!confirm(`確定刪除這筆資料嗎？\n${row.id}`)) return;

        const { error } = await supabase.from(row.table).delete().eq("id", row.id);
        if (error) {
          alert("刪除失敗：" + error.message);
          return;
        }
        alert("刪除成功");
        setSelected(null);
        fetchAll();
      };
const openPwdModal = () => {
  if (!isAdmin) return; // 員工不可開
  setPwdErr("");
  setPwdOk("");
  setPwdTarget("admin");
  setOldPassword("");
  setNewPassword("");
  setConfirmPassword("");
  setShowPwdModal(true);
};

const closePwdModal = () => {
  setShowPwdModal(false);
  setPwdErr("");
  setPwdOk("");
  setOldPassword("");
  setNewPassword("");
  setConfirmPassword("");
};

const handleChangePassword = async (e) => {
  e.preventDefault();
  setPwdErr("");
  setPwdOk("");

  if (!isAdmin) {
    setPwdErr("只有管理員可以修改密碼");
    return;
  }

  if (!oldPassword) {
    setPwdErr(`請輸入${pwdTarget === "admin" ? "管理員" : "員工"}舊密碼`);
    return;
  }
  if (!newPassword || newPassword.length < 6) {
    setPwdErr("新密碼至少 6 碼");
    return;
  }
  if (newPassword !== confirmPassword) {
    setPwdErr("確認新密碼不一致");
    return;
  }

  setPwdLoading(true);

  // 先保存目前（管理員）session，改員工密碼後再切回來
  const { data: sData } = await supabase.auth.getSession();
  const adminSessionBackup = sData?.session || null;

  const targetEmail = pwdTarget === "admin" ? ADMIN_EMAIL : STAFF_EMAIL;

  // 1) 用「目標帳號 + 舊密碼」驗證
  const { error: verifyError } = await supabase.auth.signInWithPassword({
    email: targetEmail,
    password: oldPassword
  });

  if (verifyError) {
    setPwdLoading(false);
    setPwdErr("舊密碼錯誤，請重新輸入");
    return;
  }

  // 2) 目前登入已切成目標帳號，直接改該帳號密碼
  const { error: updateError } = await supabase.auth.updateUser({
    password: newPassword
  });

  if (updateError) {
    setPwdLoading(false);
    setPwdErr("修改失敗：" + updateError.message);
    return;
  }

  // 3) 若改的是員工，切回管理員 session
  if (pwdTarget === "staff" && adminSessionBackup?.access_token && adminSessionBackup?.refresh_token) {
    const { error: restoreErr } = await supabase.auth.setSession({
      access_token: adminSessionBackup.access_token,
      refresh_token: adminSessionBackup.refresh_token
    });

    if (restoreErr) {
      setPwdLoading(false);
      setPwdOk("員工密碼已修改成功，請重新登入管理員");
      setTimeout(async () => {
        await supabase.auth.signOut();
        onSignOut();
      }, 900);
      return;
    }
  }

  setPwdLoading(false);
  setPwdOk(pwdTarget === "admin" ? "管理員密碼修改成功" : "員工密碼修改成功");
  setOldPassword("");
  setNewPassword("");
  setConfirmPassword("");

  setTimeout(() => {
    closePwdModal();
  }, 1000);
};
      return (
        <div className="min-h-screen pb-10">
          <nav className="sticky top-0 z-40 bg-white/70 backdrop-blur border-b border-white">
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <img src="logo.png" className="w-9 h-9 object-contain" />
                <div>
                  <div className="font-black text-mv-ink text-lg leading-none">喵之谷 Admin</div>
                  <div className="text-[10px] text-mv-sub tracking-widest">MEOW VALLEY</div>
                </div>
              </div>

<div className="flex items-center">
{isAdmin && (
  <>
    <button className="mv-top-link" onClick={openPwdModal}>
      <Icon name="key" size={14} />
      <span>變更密碼</span>
    </button>
    <span className="mv-top-sep"></span>
  </>
)}
  <button
    className="mv-top-link"
    onClick={async () => {
      await supabase.auth.signOut();
      onSignOut();
    }}
  >
    <Icon name="log-out" size={14} />
    <span>登出</span>
  </button>
</div>
            </div>
          </nav>

          <main className="max-w-6xl mx-auto p-4 md:p-6 space-y-4">
            {fetchError && (
              <div className="cute-card p-4 border border-red-200 bg-red-50/60">
                <div className="text-sm font-black text-red-600 mb-1">資料讀取失敗</div>
                <pre className="text-xs whitespace-pre-wrap text-red-500">{fetchError}</pre>
              </div>
            )}

            <div className="glass p-4">
              <div className="grid grid-cols-2 md:grid-cols-5 gap-2 mb-3">
                {[
                  {k:"all",label:"全部"},
                  {k:"grooming",label:"美容"},
                  {k:"boarding",label:"住宿"},
                  {k:"homecare",label:"到府"},
                  {k:"maine",label:"緬因詢問"},
                ].map(t=>(
                  <button key={t.k} onClick={()=>setTab(t.k)} className={"tab-btn " + (tab===t.k ? "active" : "")}>
                    {t.label}
                  </button>
                ))}
              </div>

              <div className="relative">
                <div className="absolute left-3 top-1/2 -translate-y-1/2 text-mv-sub"><Icon name="search" size={14}/></div>
                <input
                  className="input pl-9"
                  placeholder="搜尋：姓名 / 電話 / 毛孩 / ID"
                  value={q}
                  onChange={e=>setQ(e.target.value)}
                />
              </div>
            </div>

            <div className="text-sm text-mv-sub font-bold">共 {filtered.length} 筆</div>

            {loading ? (
              <div className="cute-card p-8 text-center text-mv-sub font-bold">載入中...</div>
            ) : filtered.length === 0 ? (
              <div className="cute-card p-8 text-center text-mv-sub font-bold">目前沒有符合資料</div>
            ) : (
              <div className="space-y-3">
{filtered.map(r => {
  const accentClass = `mv-record-${r.type}`;
  const showSubTag = r.type === "maine" && !!r.subtype;
const mainTitle = r.pet_name || r.owner_name || "未填姓名";
const ownerText = r.owner_name || "-";

  return (
    <button
      key={`${r.table}-${r.id}`}
      onClick={() => setSelected(r)}
      className={`mv-record ${accentClass}`}
    >
      <div className="mv-record-head">
        <div className="min-w-0">
          <div className="mv-record-meta">
            <span className={typePillClass(r.type)}>{typeLabel(r.type)}</span>
            {showSubTag && <span className="mv-subtag">{r.subtype}</span>}
          </div>

<div className="mv-record-name truncate">{mainTitle}</div>
        </div>

        <div className="mv-record-time">{formatTWDateTime(r.created_at) || "-"}</div>
      </div>

      <div className="mv-record-line"></div>

<div className="mv-record-foot">
  <div className="mv-record-ownerphone">
    <span className="mv-record-owner">{ownerText}</span>
    <span className="mv-record-phone">{r.phone || "-"}</span>
  </div>
  <div className="text-mv-sub"><Icon name="chevron-right" size={16}/></div>
</div>
    </button>
  );
})}
              </div>
            )}
          </main>

          <DetailModal
            row={selected}
            canDelete={isAdmin}
            onDelete={handleDelete}
            onClose={()=>setSelected(null)}
          />
          {showPwdModal && (
  <div className="mv-pwd-mask" onClick={closePwdModal}>
    <div className="mv-pwd-panel" onClick={(e)=>e.stopPropagation()}>
      <div className="flex items-center justify-end">
        <button className="mv-pwd-close" onClick={closePwdModal}>
          <Icon name="x" size={20} />
        </button>
      </div>

      <h3 className="mv-pwd-title">帳號密碼變更</h3>

<div className="mv-pwd-role-wrap">
  <button
    type="button"
    className={"mv-pwd-role " + (pwdTarget === "admin" ? "active" : "")}
    onClick={() => setPwdTarget("admin")}
  >
    管理員
  </button>
  <button
    type="button"
    className={"mv-pwd-role " + (pwdTarget === "staff" ? "active" : "")}
    onClick={() => setPwdTarget("staff")}
  >
    一般員工
  </button>
</div>

      <form onSubmit={handleChangePassword} className="space-y-3">
        <input
          type="password"
          className="mv-pwd-input"
placeholder={pwdTarget === "admin" ? "請輸入管理員舊密碼" : "請輸入員工舊密碼"}
          value={oldPassword}
          onChange={(e)=>setOldPassword(e.target.value)}
        />

        <div className="mv-pwd-line"></div>

        <input
          type="password"
          className="mv-pwd-input"
          placeholder="新密碼 (至少 6 位)"
          value={newPassword}
          onChange={(e)=>setNewPassword(e.target.value)}
        />

        <input
          type="password"
          className="mv-pwd-input"
          placeholder="確認新密碼"
          value={confirmPassword}
          onChange={(e)=>setConfirmPassword(e.target.value)}
        />

        {pwdErr && <div className="mv-pwd-err">{pwdErr}</div>}
        {pwdOk && <div className="mv-pwd-ok">{pwdOk}</div>}

        <button type="submit" className="mv-pwd-submit" disabled={pwdLoading}>
          {pwdLoading ? "修改中..." : "確認修改"}
        </button>
      </form>
    </div>
  </div>
)}
        </div>
      );
    }

    function App(){
      const [session, setSession] = useState(null);
      const [checking, setChecking] = useState(true);

      useEffect(() => {
        supabase.auth.getSession().then(({ data }) => {
          setSession(data.session);
          setChecking(false);
        });

        const { data: listener } = supabase.auth.onAuthStateChange((_event, s) => {
          setSession(s);
        });

        return () => listener.subscription.unsubscribe();
      }, []);

      if (checking) return <div className="min-h-screen flex items-center justify-center">Checking session...</div>;

      // 保護：不是指定帳號就登出
      if (session?.user?.email && ![ADMIN_EMAIL, STAFF_EMAIL].includes(session.user.email)) {
        supabase.auth.signOut();
        return <LoginView onLoggedIn={()=>window.location.reload()} />;
      }

      return session
        ? <Dashboard session={session} onSignOut={()=>setSession(null)} />
        : <LoginView onLoggedIn={()=>window.location.reload()} />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js?v=8').then(function (reg) {

          if (reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }

          reg.addEventListener('updatefound', function () {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', function () {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                newWorker.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
        }).catch(function (err) {
          console.error('Admin SW 註冊失敗:', err);
        });

        navigator.serviceWorker.addEventListener('controllerchange', function () {
          window.location.reload();
        });
      });
    }
  </script>
</body>
</html>
